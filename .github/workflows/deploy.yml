name: 发布「留白」博客
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 获取网站源码
        uses: actions/checkout@v4
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 生成文章页面数据
        run: python build.py --output dist
      - name: 配置 Pages
        uses: actions/configure-pages@v5
      - name: 打包网页
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: 发布网站
        id: deployment
        uses: actions/deploy-pages@v4
