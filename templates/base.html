<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#faf9f6">
  <meta name="description" content="{{ description }}">
  <meta property="og:type" content="{{ 'article' if page == 'article' else 'website' }}">
  <meta property="og:title" content="{{ title }}">
  <meta property="og:description" content="{{ description }}">
  {% if canonical %}<link rel="canonical" href="{{ canonical }}">{% endif %}
  {% if og_image %}<meta property="og:image" content="{{ og_image }}">{% endif %}
  <title>{{ title }}</title>
  <link rel="icon" href="{{ root }}favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{ root }}styles.css">
  <script defer src="{{ root }}app.js"></script>
</head>
<body class="page-{{ page }}">
  <div class="reading-progress" id="reading-progress" aria-hidden="true"></div>
  <header class="site-header" id="top">
    <div class="container header-inner">
      <a class="brand" href="{{ root }}index.html" aria-label="{{ site.name }}博客首页">{{ site.name }}</a>
      <nav class="main-nav" id="main-nav" aria-label="主要导航">
        <a class="{% if page == 'home' %}selected{% endif %}" href="{{ root }}index.html">首页</a>
        <a class="{% if page in ['archive', 'article'] %}selected{% endif %}" href="{{ root }}archive.html">文章</a>
        <a class="{% if page == 'about' %}selected{% endif %}" href="{{ root }}about.html">关于</a>
      </nav>
      <div class="header-tools">
        <button class="theme-btn icon-btn" id="theme-btn" type="button" aria-label="切换深色模式" title="切换深色模式">
          <svg class="moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20.1 15.4A8.7 8.7 0 0 1 8.6 3.9a8.7 8.7 0 1 0 11.5 11.5Z"/></svg>
          <svg class="sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="menu-btn icon-btn" id="menu-btn" type="button" aria-label="打开菜单" aria-expanded="false" aria-controls="main-nav">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </div>
  </header>
  {% block body %}{% endblock %}
  <footer class="site-footer">
    <div class="container footer-inner">
      <span>© {{ year }} {{ site.author }} · {{ site.name }}</span>
      <span class="footer-motto">{{ site.footerLine }}</span>
      <div class="footer-links"><a href="{{ root }}archive.html">文章归档</a><a href="https://app.pagescms.org" target="_blank" rel="noopener noreferrer" title="仅作者登录后使用">写作后台</a><a href="#top">回到顶部 ↑</a></div>
    </div>
  </footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
